name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          echo "$unformatted"
          test -z "$unformatted"
      - run: go build ./...
      - run: go vet ./...
      - uses: golang/govulncheck-action@v1
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm test

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workers/apns/package-lock.json
            workers/fcn/package-lock.json
      - run: npm ci
        working-directory: workers/apns
      - run: npm audit --omit=dev --audit-level=low
        working-directory: workers/apns
      - run: npm run typecheck
        working-directory: workers/apns
      - run: npm ci
        working-directory: workers/fcn
      - run: npm audit --omit=dev --audit-level=low
        working-directory: workers/fcn
      - run: npm run typecheck
        working-directory: workers/fcn
      - run: node --test push-relay-shared/*.test.mts workers/apns/src/*.test.mts workers/fcn/src/*.test.mts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kysignon-ci .
      - name: Smoke test production image
        run: |
          container_id=$(docker run -d kysignon-ci)
          trap 'docker rm -f "$container_id"' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container_id" wget -q --spider http://localhost:5867/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
      - name: Reject public HTTP issuer
        run: |
          if docker run --rm -e KYSIGNON_ISSUER_URL=http://auth.example.test kysignon-ci; then
            echo "server accepted a non-loopback HTTP issuer"
            exit 1
          fi

      # Hand the exact image the checks above ran against to the publish job,
      # so what gets pushed is what was tested, never a second build.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save kysignon-ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1

  # Publishes the image CI tested: only for pushes to master, only
  # after every job passed, and with no checkout and no build of its own, so
  # the pushed bytes are the tested bytes. A pull request from a fork must
  # never reach this job or write a package.
  publish:
    needs: [go, web, relay, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled: a run that has pushed :<sha> must
    # be allowed to finish attesting it. Ordering is handled below, not here.
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Name derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name. The commit
      # tag is what lets an operator pin a known-good image and roll back to it;
      # :latest alone gives them nowhere to go.
      - id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kysignon-ci "$name:$GITHUB_SHA"
          docker tag kysignon-ci "$name:latest"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # :latest moves only to the current tip of master. Two runs are
          # serialised but not ordered, so a slower run for an older commit
          # would otherwise move :latest backwards. The :<sha> tag above and
          # the attestation below are unconditional.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker push "$name:latest"
            echo "Published \`$name@$digest\` as \`:latest\` and \`:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`$name@$digest\` as \`:$GITHUB_SHA\` only: master has moved on to $tip" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Binds the pushed manifest to this run and commit. Verifying it here, the
      # way an operator would, proves the attestation is usable and not just present.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY"
