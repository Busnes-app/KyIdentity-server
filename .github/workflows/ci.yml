name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          echo "$unformatted"
          test -z "$unformatted"
      - run: go build ./...
      - run: go vet ./...
      - uses: golang/govulncheck-action@v1
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm test

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workers/apns/package-lock.json
            workers/fcn/package-lock.json
      - run: npm ci
        working-directory: workers/apns
      - run: npm audit --omit=dev --audit-level=low
        working-directory: workers/apns
      - run: npm run typecheck
        working-directory: workers/apns
      - run: npm ci
        working-directory: workers/fcn
      - run: npm audit --omit=dev --audit-level=low
        working-directory: workers/fcn
      - run: npm run typecheck
        working-directory: workers/fcn
      - run: node --test push-relay-shared/*.test.mts workers/apns/src/*.test.mts workers/fcn/src/*.test.mts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kysignon-ci .
      - name: Smoke test production image
        run: |
          container_id=$(docker run -d kysignon-ci)
          trap 'docker rm -f "$container_id"' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container_id" wget -q --spider http://localhost:5867/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
      - name: Reject public HTTP issuer
        run: |
          if docker run --rm -e KYSIGNON_ISSUER_URL=http://auth.example.test kysignon-ci; then
            echo "server accepted a non-loopback HTTP issuer"
            exit 1
          fi

  # Publishes the image only after every job above has passed, and only for
  # pushes to master: a pull request from a fork must never write a package.
  publish:
    needs: [go, web, relay, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The commit tag is what lets an operator pin a known-good image and
      # roll back to it; :latest alone gives them nowhere to go.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
