name: publish release image

# A published release vX.Y.Z (or vX.Y.Z.N, from dependency-release.yml) publishes
# the immutable :X.Y.Z[.N] image, attests and verifies it, then moves :stable.
# :<sha> and :latest belong to ci.yml.
#
# A release created by a workflow's GITHUB_TOKEN raises no release event, so
# dependency-release.yml dispatches this workflow on the release's tag instead.
on:
  release:
    types: [published]
  workflow_dispatch:

# Serialised so two releases cannot race to move :stable. Never cancelled: a run
# that pushed :X.Y.Z must finish attesting it.
concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      IMAGE_NAME: ghcr.io/busnes-app/kyidentity-server
      # The release event names its tag; a dispatch runs on the tag's ref.
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
    steps:
      # Red, not skipped: a skipped job is green and leaves a release with no image.
      # A dispatch must run on a tag that has a published release, so it can only
      # build what a release event would have.
      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(([0-9]+\.[0-9]+\.[0-9]+)(\.[1-9][0-9]*)?)$ ]]; then
            echo "::error::release tag must be v<major>.<minor>.<patch> or v<major>.<minor>.<patch>.<n>, got: $TAG" >&2
            exit 1
          fi
          echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "line=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = release ]; then
            echo "prerelease=$EVENT_PRERELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::dispatch this workflow on a release tag, not a branch" >&2
            exit 1
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{draft, prerelease}')"
          if [ "$(jq -r .draft <<< "$release")" != false ]; then
            echo "::error::$TAG has no published release" >&2
            exit 1
          fi
          echo "prerelease=$(jq -r .prerelease <<< "$release")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # A branch named like the tag must not stand in for it: build only the
      # commit this release event names.
      - name: Require the checkout to be the released commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$head" != "$want" ]; then
            echo "::error::checked out $head, but the release names $want" >&2
            exit 1
          fi

      # internal/appversion/VERSION is the only version source. The image reports
      # the tag's full version (the build sets it); the tag's X.Y.Z must be the file's.
      - name: Require the tag to match internal/appversion/VERSION
        env:
          LINE: ${{ steps.version.outputs.line }}
        run: |
          set -euo pipefail
          file="$(tr -d '[:space:]' < internal/appversion/VERSION)"
          echo "tag line: $LINE; internal/appversion/VERSION: ${file:-<empty>}"
          if [ "$file" != "$LINE" ]; then
            echo "::error::$TAG is on the $LINE line, but internal/appversion/VERSION says ${file:-nothing}" >&2
            echo "Bump internal/appversion/VERSION in the commit you tag." >&2
            exit 1
          fi

      # Provenance says where an image came from, not that it works. Check the
      # commit actually checked out (for an annotated tag GITHUB_SHA can name the
      # tag object), and require every ci.yml job by name: a cancelled or skipped
      # job must not read as a pass. filter=latest lets a re-run supersede its
      # original; only GitHub Actions' own check runs count.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One ci.yml job name per line, as the check runs report them.
          REQUIRED: |
            go
            web
            relay
            docker
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "tagged commit: $sha"
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          printf 'check runs for this commit:\n%s\n' "${runs:-<none>}"

          missing=""
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            rows="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j { print $2 "/" $3 }')"
            if [ -z "$rows" ]; then
              missing="$missing [$job](absent)"
            elif bad="$(printf '%s\n' "$rows" | grep -v '^completed/success$')"; then
              missing="$missing [$job]($(printf '%s' "$bad" | tr '\n' ','))"
            fi
          done <<< "$REQUIRED"

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish $sha: CI did not pass for it:$missing" >&2
            echo "Let ci.yml finish green on this commit (push to master or open a PR) before releasing." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Only the immutable tag here. :stable moves after the attestation verifies,
      # so a failed attest never leaves :stable on an unattested image.
      - name: Build and publish the immutable version tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true

      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Verified the way an operator would, pinned to this workflow at this tag.
      - name: Verify the attestation before promoting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG"

      # :stable only moves forward, and never to a prerelease: publishing a patch
      # for an old line must not downgrade everyone following :stable.
      - name: Decide whether this release may move stable
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::$VERSION is a prerelease; :stable stays where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed lookup must stop here: an empty list would make this release "highest".
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          published="$(printf '%s\n' "$tags" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(\.[1-9][0-9]*)?$' || true)"
          highest="$(printf '%s\n%s\n' "$published" "$VERSION" | sort -V | tail -n1)"
          echo "highest published release: $highest; this release: $VERSION"
          if [ "$highest" != "$VERSION" ]; then
            echo "::notice::$VERSION is older than $highest; :stable stays where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      # By digest, as a carbon copy (--prefer-index=false), then asserted and
      # verified on the tag operators actually pull.
      - name: Promote the verified digest to stable
        if: steps.promote.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:stable" "$IMAGE_NAME@$DIGEST"
          stable="$(docker buildx imagetools inspect "$IMAGE_NAME:stable" --format '{{.Manifest.Digest}}')"
          if [ "$stable" != "$DIGEST" ]; then
            echo "::error:::stable resolves to $stable, attested digest is $DIGEST" >&2
            exit 1
          fi
          gh attestation verify "oci://$IMAGE_NAME:stable" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG"
          echo "Published \`$IMAGE_NAME@$DIGEST\` as \`:$VERSION\` and \`:stable\`" >> "$GITHUB_STEP_SUMMARY"
