# The docs/FORWARD-AUTH.md snippet, over plain HTTP on loopback for the check script.
events {}
http {
    access_log off;
    upstream kyidentity { server 127.0.0.1:KYID_PORT; }

    # The protected app: echoes what it was sent.
    server {
        listen 127.0.0.1:APP_PORT;
        location / {
            default_type text/plain;
            return 200 "user=$http_x_ky_user webauth=$http_x_webauth_user underscore=$http_x_webauth_user_ email=$http_x_ky_email groups=$http_x_ky_groups secret=$http_x_ky_edge_secret\n";
        }
    }

    server {
        listen 127.0.0.1:EDGE_PORT;
        server_name app.e2e.test;
        underscores_in_headers off;

        location = /.ky/check {
            internal;
            rewrite ^ /api/forward/check? break;
            proxy_pass http://kyidentity;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host kyidentity;
            proxy_set_header X-Forwarded-Host app.e2e.test;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Ky-Edge-Secret "EDGE_SECRET";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /.ky/start    { rewrite ^ /forward/begin break;    proxy_pass http://kyidentity; include /etc/nginx/ky-edge.conf; }
        location = /.ky/callback { rewrite ^ /forward/callback break; proxy_pass http://kyidentity; include /etc/nginx/ky-edge.conf; }
        location = /.ky/logout   { rewrite ^ /forward/logout? break;  proxy_pass http://kyidentity; include /etc/nginx/ky-edge.conf; }
        location @ky_login {
            rewrite ^ /forward/begin? break;
            proxy_pass http://kyidentity;
            include /etc/nginx/ky-edge.conf;
            proxy_set_header X-Original-URI $request_uri;
        }
        location / {
            auth_request /.ky/check;
            auth_request_set $ky_user   $upstream_http_x_ky_user;
            auth_request_set $ky_email  $upstream_http_x_ky_email;
            auth_request_set $ky_groups $upstream_http_x_ky_groups;
            error_page 401 = @ky_login;
            proxy_set_header X-Ky-User   $ky_user;
            proxy_set_header X-Ky-Email  $ky_email;
            proxy_set_header X-Ky-Groups $ky_groups;
            proxy_set_header X-WEBAUTH-USER $ky_user;
            proxy_set_header X-Ky-Edge-Secret "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:APP_PORT;
        }
    }
}
