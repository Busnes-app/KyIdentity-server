name: kysignon-server

services:
  kysignon-server:
    # The published, attested image. `pull` moves to the newest one; `up` uses what is
    # present, otherwise pulls. This file never builds: a source build would occupy this
    # name with unattested bytes, so it lives in docker-compose.build.yml under a local tag.
    # Source installs put `COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml` in .env; Compose
    # reads it before every command. An explicit -f list replaces it outright, so never mix the two.
    # To run only what CI attested, pin by digest and verify it first (gh logged in):
    #   d=$(docker buildx imagetools inspect ghcr.io/busness-app/kysignon-server:latest --format '{{.Manifest.Digest}}')
    #   gh attestation verify oci://ghcr.io/busness-app/kysignon-server@$d --repo Busness-app/kysignon-server \
    #     --cert-identity https://github.com/Busness-app/kysignon-server/.github/workflows/ci.yml@refs/heads/master
    #   (umask 077; echo "KYSIGNON_IMAGE=ghcr.io/busness-app/kysignon-server@$d" >> .env); chmod 600 .env
    image: ${KYSIGNON_IMAGE:-ghcr.io/busness-app/kysignon-server:latest}
    pull_policy: missing
    container_name: KySignOn-Server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      kypost-net:
        ipv4_address: ${KYSIGNON_IP:-10.89.0.2}

    ports:
      - "${KYSIGNON_BIND:-127.0.0.1}:5867:5867"

    # Names that exist only on your LAN (a KyRecovery behind your own proxy) may not resolve
    # in here when the host uses a loopback stub resolver. Add docker-compose.lan-dns.yml
    # with KYSIGNON_DNS set; it is not in this file because a dns: entry replaces the host's
    # resolvers for every lookup, which must be a choice, not a default.

    environment:
      KYSIGNON_PORT: 5867
      KYSIGNON_ISSUER_URL: ${KYSIGNON_ISSUER_URL:-http://localhost:5867}
      KYSIGNON_DB_PATH: /data/kysignon.db
      KYSIGNON_DATA_DIR: /data
      # Empty by default: no peer may forge its client IP. Set to your proxy's address only.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # The one header a trusted proxy is believed on. Set to CF-Connecting-IP behind
      # Cloudflare. Only one is honoured, so the header your edge does not overwrite can
      # never become an attacker-chosen client identity.
      KYSIGNON_FORWARDED_HEADER: ${KYSIGNON_FORWARDED_HEADER:-X-Forwarded-For}
      KYSIGNON_SECURE_COOKIES: ${KYSIGNON_SECURE_COOKIES:-}
      KYSIGNON_SESSION_TTL: ${KYSIGNON_SESSION_TTL:-24h}
      KYSIGNON_SESSION_IDLE_TTL: ${KYSIGNON_SESSION_IDLE_TTL:-30m}
      KYSIGNON_SECRET_KEY: ${KYSIGNON_SECRET_KEY:-}
      KYSIGNON_ENCRYPTION_KEY: ${KYSIGNON_ENCRYPTION_KEY:-}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_KEY: ${PUSH_RELAY_KEY:-}
      APNS_RELAY_URL: ${APNS_RELAY_URL:-}
      APNS_RELAY_KEY: ${APNS_RELAY_KEY:-}
      # Services on kypost-net address each other privately, so pairing callbacks there
      # are internal by design. Set to false if KySignOn is reachable from the internet
      # and paired systems live on public hostnames.
      KYSIGNON_ALLOW_PRIVATE_CALLBACKS: ${KYSIGNON_ALLOW_PRIVATE_CALLBACKS:-true}
      # Backups. The schedule is set in the admin UI; this is only its default. A local
      # capsule directory is a second destination (or the only one, with no KyRecovery);
      # mount a volume there. Allow a private KyRecovery only for one on your own network
      # behind TLS: HTTPS stays required, and the setting is recorded on every pairing.
      KYSIGNON_BACKUP_DEPOSIT_INTERVAL: ${KYSIGNON_BACKUP_DEPOSIT_INTERVAL:-24h}
      KYSIGNON_BACKUP_DIR: ${KYSIGNON_BACKUP_DIR:-}
      KYSIGNON_BACKUP_KEEP: ${KYSIGNON_BACKUP_KEEP:-7}
      KYSIGNON_BACKUP_ALLOW_PRIVATE_RECOVERY: ${KYSIGNON_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASS: ${BOOTSTRAP_ADMIN_PASS:-}

    volumes:
      - kysignon_data:/data

    healthcheck:
      # /readyz, not /healthz: this must go unhealthy when the database or key material is
      # gone, rather than when the process has stopped answering at all.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5867/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  kysignon_data:

networks:
  kypost-net:
    name: ${KYPOST_NETWORK:-kypost-net}
    external: true
