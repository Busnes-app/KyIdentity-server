name: kysignon-server

services:
  kyidentity-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: KyIdentity-Server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      kypost-net:
        ipv4_address: ${KYIDENTITY_IP:-10.89.0.2}

    ports:
      - "${KYIDENTITY_BIND:-127.0.0.1}:5867:5867"

    # Names that exist only on your LAN (a KyRecovery behind your own proxy) may not resolve
    # in here when the host uses a loopback stub resolver. Add docker-compose.lan-dns.yml
    # with KYIDENTITY_DNS set; it is not in this file because a dns: entry replaces the host's
    # resolvers for every lookup, which must be a choice, not a default.

    environment:
      KYIDENTITY_PORT: 5867
      KYIDENTITY_ISSUER_URL: ${KYIDENTITY_ISSUER_URL:?set KYIDENTITY_ISSUER_URL}
      # Keep the legacy names visible to the process so a pre-rename .env fails closed
      # instead of being silently replaced by the defaults below.
      KYSIGNON_IP: ${KYSIGNON_IP:-}
      KYSIGNON_BIND: ${KYSIGNON_BIND:-}
      KYSIGNON_PORT: ${KYSIGNON_PORT:-}
      KYSIGNON_ISSUER_URL: ${KYSIGNON_ISSUER_URL:-}
      KYSIGNON_DB_PATH: ${KYSIGNON_DB_PATH:-}
      KYSIGNON_DATA_DIR: ${KYSIGNON_DATA_DIR:-}
      KYSIGNON_FORWARDED_HEADER: ${KYSIGNON_FORWARDED_HEADER:-}
      KYSIGNON_SECURE_COOKIES: ${KYSIGNON_SECURE_COOKIES:-}
      KYSIGNON_SESSION_TTL: ${KYSIGNON_SESSION_TTL:-}
      KYSIGNON_SESSION_IDLE_TTL: ${KYSIGNON_SESSION_IDLE_TTL:-}
      KYSIGNON_SECRET_KEY: ${KYSIGNON_SECRET_KEY:-}
      KYSIGNON_ENCRYPTION_KEY: ${KYSIGNON_ENCRYPTION_KEY:-}
      KYSIGNON_RSA_KEY_PATH: ${KYSIGNON_RSA_KEY_PATH:-}
      KYSIGNON_APP_NAME: ${KYSIGNON_APP_NAME:-}
      KYSIGNON_ALLOW_PRIVATE_CALLBACKS: ${KYSIGNON_ALLOW_PRIVATE_CALLBACKS:-}
      KYSIGNON_BACKUP_DEPOSIT_INTERVAL: ${KYSIGNON_BACKUP_DEPOSIT_INTERVAL:-}
      KYSIGNON_BACKUP_DIR: ${KYSIGNON_BACKUP_DIR:-}
      KYSIGNON_BACKUP_KEEP: ${KYSIGNON_BACKUP_KEEP:-}
      KYSIGNON_BACKUP_ALLOW_PRIVATE_RECOVERY: ${KYSIGNON_BACKUP_ALLOW_PRIVATE_RECOVERY:-}
      # Keep this path stable across the product rename; changing it would make Compose
      # bootstrap a second empty identity database beside the existing one.
      KYIDENTITY_DB_PATH: /data/kysignon.db
      KYIDENTITY_DATA_DIR: /data
      # Empty by default: no peer may forge its client IP. Set to your proxy's address only.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # The one header a trusted proxy is believed on. Set to CF-Connecting-IP behind
      # Cloudflare. Only one is honoured, so the header your edge does not overwrite can
      # never become an attacker-chosen client identity.
      KYIDENTITY_FORWARDED_HEADER: ${KYIDENTITY_FORWARDED_HEADER:-X-Forwarded-For}
      KYIDENTITY_SECURE_COOKIES: ${KYIDENTITY_SECURE_COOKIES:-}
      KYIDENTITY_SESSION_TTL: ${KYIDENTITY_SESSION_TTL:-24h}
      KYIDENTITY_SESSION_IDLE_TTL: ${KYIDENTITY_SESSION_IDLE_TTL:-30m}
      KYIDENTITY_SECRET_KEY: ${KYIDENTITY_SECRET_KEY:-}
      KYIDENTITY_ENCRYPTION_KEY: ${KYIDENTITY_ENCRYPTION_KEY:-}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_KEY: ${PUSH_RELAY_KEY:-}
      APNS_RELAY_URL: ${APNS_RELAY_URL:-}
      APNS_RELAY_KEY: ${APNS_RELAY_KEY:-}
      # Services on kypost-net address each other privately, so pairing callbacks there
      # are internal by design. Set to false if KyIdentity is reachable from the internet
      # and paired systems live on public hostnames.
      KYIDENTITY_ALLOW_PRIVATE_CALLBACKS: ${KYIDENTITY_ALLOW_PRIVATE_CALLBACKS:-true}
      # Backups. The schedule is set in the admin UI; this is only its default. A local
      # capsule directory is a second destination (or the only one, with no KyRecovery);
      # mount a volume there. Allow a private KyRecovery only for one on your own network
      # behind TLS: HTTPS stays required, and the setting is recorded on every pairing.
      KYIDENTITY_BACKUP_DEPOSIT_INTERVAL: ${KYIDENTITY_BACKUP_DEPOSIT_INTERVAL:-24h}
      KYIDENTITY_BACKUP_DIR: ${KYIDENTITY_BACKUP_DIR:-}
      KYIDENTITY_BACKUP_KEEP: ${KYIDENTITY_BACKUP_KEEP:-7}
      KYIDENTITY_BACKUP_ALLOW_PRIVATE_RECOVERY: ${KYIDENTITY_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASS: ${BOOTSTRAP_ADMIN_PASS:-}

    volumes:
      - kysignon_data:/data

    healthcheck:
      # /readyz, not /healthz: this must go unhealthy when the database or key material is
      # gone, rather than when the process has stopped answering at all.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5867/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  kysignon_data:

networks:
  kypost-net:
    name: ${KYPOST_NETWORK:-kypost-net}
    external: true
